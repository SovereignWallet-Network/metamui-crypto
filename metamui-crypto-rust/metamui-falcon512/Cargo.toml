[package]
name = "metamui-falcon512"
version.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "Falcon-512 (Round 3) signatures with the compressed and padded encodings, verified against the NIST Round-3 and PQClean falcon-padded-512 answer files"
edition = "2021"
rust-version.workspace = true
# Disable auto-discovery of bench files — some on-disk files
# (precision_benchmarks.rs, refinement_benchmarks.rs) have bit-rotted
# against the current public API (missing re-exports of mod_arith,
# signature changes). Explicit [[bench]] entries below list the benches
# that still build.
autobenches = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
metamui-prehash-oids = { version = "=1.0.0-rc.3", path = "../metamui-prehash-oids", optional = true, default-features = false  }
# Core dependencies
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
metamui-sha2 = { version = "=1.0.0-rc.3", path = "../metamui-sha2" }
hex = { version = "0.4", default-features = false }
# Big integer support (for NTRU equation solver)
num-bigint = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
subtle = { workspace = true, features = ["const-generics"] }
zeroize = { workspace = true, features = ["derive", "alloc"] }
once_cell = { version = "1.19", default-features = false, features = ["alloc", "race"] }
lazy_static = { version = "1.4", default-features = false, features = ["spin_no_std"] }
metamui-security-utils = { version = "=1.0.0-rc.3", path = "../metamui-security-utils"  }
metamui-shake = { version = "=1.0.0-rc.3", path = "../metamui-shake"  }
metamui-aes-256 = { version = "=1.0.0-rc.3", path = "../metamui-aes-256", features = ["native"]  }
metamui-aes-ctr-drbg = { version = "=1.0.0-rc.3", path = "../metamui-aes-ctr-drbg"  }
metamui-acvp-core = { version = "=1.0.0-rc.3", path = "../metamui-acvp-core"  }

# Optional dependencies with proper feature gating
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", optional = true, features = ["js"] }

# Optional: parallel batch operations
rayon = { version = "1.8", optional = true }

# For NIST validation binary
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
clap = { version = "4.0", optional = true, features = ["derive"] }

[features]
# Default to std for maximum compatibility
default = ["std"]

# Standard library support (most common use case)
std = []

# Enable clap for CLI tools
clap = ["dep:clap"]

# WASM with wasm-bindgen (forces std because wasm-bindgen requires it)
wasm-bindgen = ["std", "dep:wasm-bindgen", "dep:js-sys", "dep:getrandom"]

# FN-DSA (FIPS 206) draft hooks — off by default; see src/fn_dsa_draft.rs.
# Nothing here is wire-compatible with Round-3 Falcon or with the eventual
# standard: the IPD text is not public and NIST says encodings are not locked.
fn-dsa-draft = ["dep:metamui-prehash-oids"]

# Constant-time operations for side-channel resistance
constant-time = ["std"]

# Portable only. Every code path is scalar Rust that compiles the same on
# every target; there is no SIMD, assembly or GPU feature, by policy of the
# public release. Arithmetic that decides a signature's bytes is therefore
# the same arithmetic everywhere.

# Parallel batch operations via Rayon
multithreading = ["std", "dep:rayon"]

# Batch signing/verification API
batch-api = ["std"]

# Development/testing features
test-utils = ["std"]

# Seeded and known-answer entry points — `kat_api`, `deterministic_mode`,
# `deterministic_rng`, `NistCtrDrbg::new_for_kat`, the `nist_*` KAT frameworks,
# `test_helpers`, `differential_testing`, `security_audit`. They replay the
# NIST Round-3 answer files and exist for conformance gates and fixture
# generators only; an application is never offered a seed (the same rule as
# `metamui-mlkem`'s `fips203-internal`). `tests/kat_surface_gated.rs` fails if
# one of these modules is compiled without the feature.
kat-internal = ["std"]

# ACVP test vector generation
acvp = ["std"]

# FIPS compliance mode (self-tests required before use)
fips = ["std"]


[dev-dependencies]
# This crate's own tests, examples and benches build with `kat-internal`, so
# the upstream KAT gates that replay the NIST DRBG schedule are always
# compiled; a `required-features` on those targets would let `cargo test`
# skip them silently. cargo drops an unversioned dev-dependency when
# packaging, so nothing published enables the feature.
metamui-falcon512 = { path = ".", default-features = false, features = ["kat-internal"] }
wasm-bindgen-test = "0.3"
rand = { workspace = true }
rand_chacha = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = "0.5"

# NOTE: [profile.release] / [profile.bench] live in the workspace root
# Cargo.toml so they actually take effect (cargo silently ignores them in
# member manifests).

[[bench]]
name = "falcon_benchmarks"
harness = false

[[bench]]
name = "falcon_extended_benchmarks"
harness = false

# wasm32 `getrandom` backend. This crate is a cdylib, so cargo links it for
# wasm32 even when a consumer only wants the rlib, and that link needs a
# backend to resolve. Taking it from here instead of `getrandom/js` means the
# link no longer asserts that a browser is present; a consumer that IS a
# browser enables `js` itself and keeps Web Crypto (getrandom prefers `js`,
# so this registration is then inert).
[target.'cfg(target_arch = "wasm32")'.dependencies]
metamui-getrandom-unavailable = { version = "=1.0.0-rc.3", path = "../metamui-getrandom-unavailable"  }

# What docs.rs builds: the public API on one target, with only the features listed —
# never all-features, which unions host-gated and test-only features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
features = ["fn-dsa-draft"]
