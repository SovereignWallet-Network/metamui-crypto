[package]
rust-version.workspace = true
name = "metamui-hkdf"
version.workspace = true
authors = [ "Phantom Seokgu Yun <phantom@metamui.id>",]
license = "Apache-2.0"
repository.workspace = true
homepage = "https://metamui.id"
description = "HKDF (RFC 5869) with HMAC-SHA-256 and HMAC-SHA-512, verified against the RFC 5869 answer file"
readme = "README.md"
keywords = ["hkdf", "kdf", "hmac", "rfc5869", "crypto"]
categories = ["cryptography"]

[package.edition]
workspace = true

[dependencies.hex]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.metamui-sha2]
path = "../metamui-sha2"
version = "=1.0.0-rc.5"

[dev-dependencies.serde_json]
workspace = true

# Portable only. Every code path is scalar Rust that compiles the same on
# every target; there is no SIMD, assembly or GPU feature, by policy of the
# public release. The crate has no features.

# What docs.rs builds: the public API on one target. No features exist, so
# none are listed — never all-features, which unions host-gated and
# test-only features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
