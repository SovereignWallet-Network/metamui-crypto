[package]
name = "metamui-slhdsa"
version.workspace = true
authors = ["MetaMUI Cryptography Team <dev@metamui.id>"]
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "SLH-DSA (FIPS 205) stateless hash-based signatures, all twelve SHAKE and SHA-2 parameter sets, verified against the NIST ACVP answer files"
repository.workspace = true
keywords = ["cryptography", "post-quantum", "slh-dsa", "sphincs", "signatures"]
categories = ["cryptography", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/metamui-slhdsa"

# Hashing is MetaMUI's own SHA-2 / SHAKE; no RustCrypto crate is in this
# crate's closure (CLAUDE.md, #199).
[dependencies]
metamui-sha2 = { version = "=1.0.0-rc.5", path = "../metamui-sha2", default-features = false }
metamui-shake = { version = "=1.0.0-rc.5", path = "../metamui-shake", default-features = false }
rand_core = { version = "0.6", default-features = false }
subtle = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
metamui-acvp-core = { version = "=1.0.0-rc.5", path = "../metamui-acvp-core" }
metamui-prehash-oids = { version = "=1.0.0-rc.5", path = "../metamui-prehash-oids", default-features = false }
serde_json = { version = "1.0", optional = true }
hex = { version = "0.4", optional = true }
# Seeds the ACVP-style fixture generator (`test_vector_generator`), which is
# compiled only with `kat-internal`.
rand_chacha = { version = "0.3", optional = true }

[dev-dependencies]
# This crate's own tests, examples and benches build with `kat-internal`, so
# the upstream ACVP gate that rebuilds keys from (SK.seed, SK.prf, PK.seed)
# is always compiled; a `required-features` on those targets would let
# `cargo test` skip them silently. cargo drops an unversioned dev-dependency
# when packaging, so nothing published enables the feature.
metamui-slhdsa = { path = ".", default-features = false, features = ["kat-internal"] }
rand = { workspace = true }
rand_chacha = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = "0.5"

[features]
default = ["std"]
std = ["metamui-sha2/std", "metamui-shake/std", "rand_core/std", "serde_json", "hex"]

# Portable only. Every code path is scalar Rust that compiles the same on
# every target; there is no SIMD, assembly, GPU or thread-pool feature, by
# policy of the public release.

# Selectors kept for manifests that name a hash family or a parameter set.
# Every set of both families is always compiled; these gate nothing.
sha256 = []

# Seeded and known-answer entry points — `slh_keygen_from_seeds` (FIPS 205
# `slh_keygen_internal`), `signing::slh_sign_core` / `slh_sign_internal`
# (Algorithm 19 with a caller-supplied randomizer) and the ACVP fixture
# generator `test_vector_generator`. They replay the NIST ACVP answer files
# and exist for conformance gates and fixture generators only; an
# application is never offered a seed (the same rule as `metamui-mlkem`'s
# `fips203-internal`). `tests/kat_surface_gated.rs` fails if one of them is
# compiled without the feature.
kat-internal = ["std", "dep:rand_chacha"]

# Parameter set features
slh-dsa-128s = []
slh-dsa-128f = []
slh-dsa-192s = []
slh-dsa-192f = []
slh-dsa-256s = []
slh-dsa-256f = []
all-params = ["slh-dsa-128s", "slh-dsa-128f", "slh-dsa-192s", "slh-dsa-192f", "slh-dsa-256s", "slh-dsa-256f"]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack]
wasm-opt = false

# wasm32 `getrandom` backend. This crate is a cdylib, so cargo links it for
# wasm32 even when a consumer only wants the rlib, and that link needs a
# backend to resolve. Taking it from here instead of `getrandom/js` means the
# link no longer asserts that a browser is present; a consumer that IS a
# browser enables `js` itself and keeps Web Crypto (getrandom prefers `js`,
# so this registration is then inert).
[target.'cfg(target_arch = "wasm32")'.dependencies]
metamui-getrandom-unavailable = { version = "=1.0.0-rc.5", path = "../metamui-getrandom-unavailable" }

# What docs.rs builds: the public API on one target, with only the features listed —
# never all-features, which unions host-gated and test-only features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
features = ["all-params"]
