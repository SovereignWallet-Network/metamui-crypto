[package]
name = "metamui-acceleration"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = ["Phantom Seokgu Yun <phantom@metamui.id>"]
license = "Apache-2.0"
description = "Hardware acceleration support for MetaMUI cryptographic primitives"
repository.workspace = true
keywords = ["crypto", "acceleration", "simd", "hardware", "metamui"]
categories = ["cryptography", "hardware-support"]

[dependencies]

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
# No external dependencies, using std::arch

[target.'cfg(target_arch = "aarch64")'.dependencies]
# No external dependencies, using std::arch

[dev-dependencies]
criterion = "0.5"
rand = { workspace = true }

[features]
default = ["std"]
std = []
# Enable specific CPU features for testing
force-soft = []  # Force software implementations

# [[bench]]
# name = "acceleration_benchmarks"
# harness = false

# What docs.rs builds: the public API on one target, with only the features listed —
# never all-features, which unions host-gated and test-only features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
