[package]
name = "metamui-sha3"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = ["Phantom Seokgu Yun <phantom@metamui.id>"]
license = "Apache-2.0"
description = "Pure Rust implementation of SHA3-256, SHA3-384, and SHA3-512 hash functions"
repository.workspace = true
keywords = ["crypto", "sha3", "hash", "keccak", "no-std"]
categories = ["cryptography", "no-std"]

[features]
default = ["std"]
std = []

[dependencies]
metamui-security-utils = { path = "../metamui-security-utils", version = "=1.0.0-rc.3" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[lib]
name = "metamui_sha3"
path = "src/lib.rs"

# What docs.rs builds: the public API on one target, with only the features listed —
# never all-features, which unions host-gated and test-only features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
