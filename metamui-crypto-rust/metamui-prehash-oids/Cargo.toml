[package]
name = "metamui-prehash-oids"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = ["MetaMUI Team"]
license = "Apache-2.0"
description = "FIPS 204 §5.4.1 / FIPS 205 §10.2.2 pre-hash algorithm table: DER OIDs and PH(M) for HashML-DSA and HashSLH-DSA"
repository.workspace = true
categories = ["cryptography", "no-std"]

# Every digest in the table is MetaMUI's own implementation; no RustCrypto
# crate is in this crate's closure.
[dependencies]
metamui-sha2 = { version = "=1.0.0-rc.1", path = "../metamui-sha2", default-features = false }
metamui-sha3 = { version = "=1.0.0-rc.1", path = "../metamui-sha3", default-features = false }
metamui-shake = { version = "=1.0.0-rc.1", path = "../metamui-shake", default-features = false }

[features]
default = ["std"]
std = ["metamui-sha2/std", "metamui-sha3/std", "metamui-shake/std"]

# What docs.rs builds: the public API on one target, with only the features listed —
# never all-features, which unions host-gated and test-only features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
