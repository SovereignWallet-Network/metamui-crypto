[package]
name = "metamui-error"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = ["Phantom <phantom@metamui.id>"]
license = "Apache-2.0"
description = "Shared error types for the MetaMUI Crypto crates"
repository.workspace = true
keywords = ["crypto", "error-handling", "no-panic", "security"]
categories = ["cryptography"]

[dependencies]

[features]
default = ["std"]
std = []

[dev-dependencies]

# What docs.rs builds: the public API on one target, with only the features listed.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
