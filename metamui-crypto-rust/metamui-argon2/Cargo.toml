[package]
name = "metamui-argon2"
description = "Argon2d, Argon2i and Argon2id password hashing (RFC 9106)"
categories = ["cryptography", "no-std"]
keywords = ["argon2", "password-hashing", "kdf", "rfc9106", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
# Security utilities
metamui-security-utils = { version = "=1.0.0-rc.5", path = "../metamui-security-utils" }

# Standard library dependencies
hex = { version = "0.4", optional = true }
thiserror = { version = "1.0", optional = true }

[dev-dependencies]
hex = "0.4"
criterion = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["std"]
std = ["hex", "thiserror"]

# Portable only. Every code path is scalar Rust that compiles the same on
# every target; there is no SIMD, assembly or GPU feature, by policy of the
# public release.

# Benchmarks can be added later
# [[bench]]
# name = "argon2_bench"
# harness = false

# What docs.rs builds: the public API on one target, with only the features listed —
# never all-features, which unions host-gated and test-only features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
features = ["std"]
